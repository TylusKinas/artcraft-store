[package]
name = "depthcraft"
description = "DepthCraft: Monocular depth estimation and depth-map processing plugin for EffectCraft"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace so it can target both wasm32-unknown-unknown cdylib and native host cli.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "depthcraft-cli"
path = "src/main.rs"
required-features = ["onnx"]

[features]
# Native ONNX Runtime inference (CPU + GPU execution providers). Never enabled for the wasm build.
onnx = ["dep:ort", "dep:image", "dep:ndarray"]
# Compile the 8-bit model into depthcraft-cli (single executable, no separate .onnx).
embed-model = ["onnx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `load-dynamic`: use the user's onnxruntime shared library (ORT_DYLIB_PATH), so a GPU-enabled
# build of ONNX Runtime (CUDA / DirectML / CoreML) is picked up without bundling binaries.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda", "tensorrt", "directml", "coreml"], optional = true }
ndarray = { version = "0.17", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }


[profile.release]
opt-level = "s"
lto = true
panic = "abort"
